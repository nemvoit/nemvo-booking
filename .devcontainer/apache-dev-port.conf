# Development only: WordPress's address is http://localhost:<WP_PORT> (the published port, 8080 by
# default), so Apache also listens on that port inside the container. That way requests WordPress
# makes to itself (Site Health loopback, WP-Cron) reach it. WP_PORT comes from docker-compose.yml.
Listen ${WP_PORT}
<VirtualHost *:${WP_PORT}>
	DocumentRoot /var/www/html
</VirtualHost>
